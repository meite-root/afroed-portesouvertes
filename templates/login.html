<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Login</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body>
<div class="signup-container">
  <h1>Connexion</h1>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}<p class="{{ 'error' if category=='error' else '' }}">{{ message }}</p>{% endfor %}
  {% endwith %}
  <form method="post">
    <label>Phone or Email</label>
    <input type="text" name="identifier" required>
    <label>Password</label>
    <input type="password" name="password" required>
    <button type="submit" class="primary-btn">Login</button>
  </form>
</div>
</body></html>
