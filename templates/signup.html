<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign up</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="signup-container">
    <h1>Je m’inscris!</h1>

    {% if error %}
      <p class="error">{{ error }}</p>
    {% endif %}

    <form id="signup-form">
      <label for="name">Nom complet</label>
      <input type="text" id="name" name="name" required placeholder="Votre nom">

      <label for="phone">Mon numéro</label>
      <input type="tel" id="phone" name="phone" required placeholder="+225 03 26 60 82">

      <button type="submit" class="primary-btn">Submit</button>
    </form>

    <div id="otp-panel" class="otp-panel hidden">
      <p class="otp-message">
        Merci d’avoir renseigné un numéro valide. Veuillez maintenant confirmer qu’il vous appartient...
      </p>
      <h2>Le code de verification vous a été envoyé</h2>
      <p class="otp-subtext">Veuillez consulter votre boite SMS et inscrire le code reçu.</p>
      <div class="otp-inputs">
        <input type="text" inputmode="numeric" maxlength="1" class="otp-digit">
        <input type="text" inputmode="numeric" maxlength="1" class="otp-digit">
        <input type="text" inputmode="numeric" maxlength="1" class="otp-digit">
        <input type="text" inputmode="numeric" maxlength="1" class="otp-digit">
        <input type="text" inputmode="numeric" maxlength="1" class="otp-digit">
        <input type="text" inputmode="numeric" maxlength="1" class="otp-digit">
      </div>
      <button type="button" id="verify-btn" class="primary-btn">Verify</button>
      <p id="otp-status" class="helper-text"></p>
    </div>
  </div>
  <script src="{{ url_for('static', filename='signup.js') }}"></script>
</body>
</html>
